# pgBackRest configuration for the Local File Knowledge Base (plan §21).
#
# Purpose: continuous WAL archiving + scheduled full/incremental backups to a
# separate B2 bucket with repo encryption, enabling point-in-time recovery (§21).
#
#   Validate:  pgbackrest --config=ops/pgbackrest.conf --stanza=kb info
#   Stanza:    bash scripts/pgbackrest-stanza-create.sh
#   Backup:    bash scripts/pgbackrest-backup.sh --type full|incr
#   Restore:   bash scripts/pgbackrest-restore.sh [--target "YYYY-MM-DD HH:MM:SS"]
#
# Secrets — supplied via the environment, never committed to version control (§24):
#   B2_BACKUP_KEY_ID      — B2 application key ID for the backup bucket
#   B2_BACKUP_KEY         — B2 application key (write access to backup bucket)
#   PGBACKREST_REPO1_CIPHER_PASS — repo-level AES-256-CBC passphrase
#
# The backup bucket MUST have Object Lock enabled (§21): immutable backups are
# immune to ransomware and accidental deletion. This bucket is SEPARATE from the
# application-data bucket used by B2Blob (P8-T1); the application's B2 keys
# never touch this bucket.

[kb]
# Path to the Postgres data directory (inside the compose container or on the host).
# pgBackRest connects locally — the backup host must have pgBackRest + Postgres
# libraries installed and network access to the B2 endpoint.
pg1-path=/var/lib/postgresql/data

[global]
# ── Repository: Backblaze B2 via the S3-compatible endpoint ──────────────────
repo1-type=s3
repo1-s3-bucket=kb-backup-bucket
repo1-s3-endpoint=s3.us-west-004.backblazeb2.com
repo1-s3-region=us-west-004

# ── Encryption: AES-256-CBC at the repository level (§21, §24) ───────────────
# The cipher passphrase is read from PGBACKREST_REPO1_CIPHER_PASS at runtime.
repo1-cipher-type=aes-256-cbc

# ── Retention: 30 daily full backups, 4 differentials between fulls ──────────
# With daily full + hourly incrementals, this provides ~30 days of point-in-time
# recoverability. Adjust for your RPO target.
repo1-retention-full=30
repo1-retention-diff=4

# ── Compression & resource limits ────────────────────────────────────────────
compress-type=zst
compress-level=3
process-max=2
buffer-size=256K

# ── WAL archiving ────────────────────────────────────────────────────────────
# archive-async pushes WAL segments in the background so checkpoint performance
# isn't gated on network latency to B2.
archive-async=y
archive-timeout=60

[global:archive-push]
# WAL segments are compressed at a higher level (less frequent, so cost matters
# less than size). Single process to avoid WAL ordering issues.
compress=y
compress-level=6
process-max=1

# ── Phase P10 — Confidentiality hardening (§28, §24) ──────────────────────────
#
# P10 hardens the P8-T5 encryption bridge into a proper key hierarchy with KMS/HSM
# backing, encrypts sensitive DB columns at rest, implements crypto-shredding for
# GDPR-compliant deletion, and adds decrypt-access auditing. This moves the KEK
# from an env var to a proper key management service.

[[task]]
id = "P10-T1"
phase = "P10"
description = "Key hierarchy (production KMS hardening). The `KeyEncryptionKey` trait (wrap/unwrap) + the `FileKek` impl already exist from P8-T5 (review/p6-readiness built them there so blob encryption consumes the trait from day one) — do NOT redefine them. This task ADDS only the production impl: (b) `VaultTransitKek` — uses HashiCorp Vault's Transit engine (or cloud KMS: AWS KMS, GCP KMS) for wrap/unwrap — the KEK never enters the app process. Also define a `DataKey` struct: `{ id: Uuid, wrapped_dek: Vec<u8>, kek_id: String }` for tracking which KEK wrapped each DEK (enables rotation). DataKey is a pure abstraction — unit-testable without real KMS; the actual KMS integration tests are #[ignore]."
depends_on = ["P8-T5", "P5-T3"]
plan_sections = ["28", "24"]
acceptance = "VaultTransitKek calls correct API path (mock Vault server in tests); DataKey serializes/deserializes; KEK rotation: unwrap a DEK with the old KEK, re-wrap with the new KEK (no bulk re-encryption). The FileKek trait/impl from P8-T5 is reused unchanged. Unit tests for rotation + mock Vault. just ci green."
status = "done"
checkpoint = true
notes = "DONE: DataKey struct (kb-core::data_key, Uuid id + wrapped_dek + kek_id, serde round-trip, 14 tests) + VaultTransitKek (kb-store::vault_kek, Transit API via mock axum server, hot-swappable URL/token, 18 tests) + rotate_dek (old→new KEK re-wrap, no bulk re-encryption). FileKek trait unchanged. just ci green. CHECKPOINT (§31.5): encryption & key handling — human must review."

[[task]]
id = "P10-T2"
phase = "P10"
description = "Envelope encryption for sensitive DB columns (§28): extend the envelope pattern (P8-T5) to cover Postgres columns that contain derived plaintext. Columns to encrypt at rest: (a) `chunks.content` — the chunk text (vectors + tsv index are on encrypted volumes, LUKS). (b) `documents.summary` + `documents.user_note`. (c) Any future PII-heavy metadata fields. Use the same DEK-per-tenant model: each tenant gets a DEK (wrapped by KEK). On chunk write: encrypt content with tenant DEK → store ciphertext (base64). On read: decrypt. The search index (vectors, tsv) must stay plaintext to be queryable — it is protected at the disk layer (LUKS). This means the DB itself holds both ciphertext (content) and plaintext (search index) — the threat model is stolen DB dumps / disk theft (§28). Migration: add `content_enc` BYTEA column alongside `content` (kept for transition), with a background job to encrypt existing rows."
depends_on = ["P10-T1", "P2-T2"]
plan_sections = ["28"]
acceptance = "Chunk write → content_enc populated with ciphertext; chunk read → decrypts correctly; different tenant's DEK → decrypt fails; DB dump contains ciphertext in content_enc, not plaintext; search still works (vectors + tsv unencrypted, on LUKS); migration is backward-compatible (existing plaintext content column remains until encrypted). Unit tests for encrypt/decrypt round-trip per tenant + wrong-tenant-DEK error. just ci green."
status = "done"
checkpoint = false
notes = "DONE: kb-core::envelope (encrypt_column/decrypt_column, AES-256-GCM, 18 tests) + migration 0015 (tenant_data_keys, content_enc/summary_enc/user_note_enc columns) + PgStore KEK integration (get_or_create_tenant_dek, encrypt on write, decrypt on read, hot-swappable KEK). Dual-write keeps plaintext columns for tsv/search-index transition. just ci green."

[[task]]
id = "P10-T3"
phase = "P10"
description = "Encrypted provider API keys at rest (§24, §26.5): the `providers.api_key_enc` column (P9-T5) stores API keys encrypted with the tenant's DEK (or a system-level KEK for global providers). On write (admin sets/rotates a key): encrypt plaintext key → store ciphertext in DB. On read (at call time, P9-T1): decrypt → use in memory → zeroize after use (zeroize crate). Keys are never logged (tracing filter strips Authorization headers + key fields). The `SecretRef` in P9-T4 resolves to the decrypted key at call time. Rotation: admin provides new key → old key is overwritten (no history kept in DB; key history is in the KMS audit log)."

# BUILD_LEDGER.toml — the single source of build progress (plan §31.1).
#
# The autonomous loop (scripts/build-loop.sh) advances this file one task at a time:
#   1. pick the next `status = "done"` task whose `depends_on` are all `done`;
#   2. read its `plan_sections` + the code it touches;
#   3. implement it WITH unit tests (§31.3), following the modularity rules (§31.4);
#   4. run the Definition-of-Done gates: `just ci` (§31.2) — ALL must pass;
#   5. commit (one task = one commit, message references the id, §31.6), set status = "done";
#   6. if `checkpoint = true`, STOP and request human review before proceeding (§31.5).
#
# P0-P5 are complete (44 tasks). P6-P12 (60 tasks) are authored and todo. This file was hardened
# in the review/p6-readiness pass (see docs/analysis/): added P6-T0 (re-armed CI + Podman
# integration lane for the #[ignore] RLS/auth suites), P7-T7 (the MISSED §31.5 extractor
# untrusted-bytes checkpoint + sandboxing), P6-T11 (tag provenance/locking + retag job kind),
# P6-T12 (retrieval eval-set CI gate), P8-T13 (ingest-time thumbnails + B2/Cloudflare egress),
# P9-T12 (per-user job priority + aging), P9-T13 (bandwidth + hour/day + time-of-day controls);
# fixed the P8-T5/P10-T1 encryption-ordering so the KEK trait isn't built twice; and recorded a
# deferred P13 enterprise backlog (SSO/SCIM/RBAC/BYOK). Build "current phase first" (§31.1).

[meta]
generated = "2026-05-31"
phases_planned = ["P0", "P1", "P2", "P3", "P4", "P5", "P6", "P7", "P8", "P9", "P10", "P11", "P12"]
gate_command = "just ci"
walking_skeleton = "Complete the P0-P4 vertical slice before adding breadth (§31.6)."
# Crate versions verified against crates.io on 2026-05-29 (the plan's names had drifted):
# serde 1.0.228, serde_json 1.0.150, async-trait 0.1.89, anyhow 1.0.102, thiserror 2.0.18,
# chrono 0.4.44, hex 0.4.3, bytes 1.11.1. For P1+: tokio 1.52.3, reqwest 0.13.4, axum 0.8.9,
# sqlx 0.9.0, clap 4.6.1, tracing 0.1.44 (RE-VERIFY before use, §31.6).
app_port = 9999  # the HTTP API must serve on port 9999 (acceptance of P6; default in config)
# Standing design rule (see CLAUDE.md "Hot-swappable configuration"): runtime parameters
# (endpoints, API keys, model ids, routes, rate limits, timeouts, quotas) must be hot-swappable
# and resolved at call time from a swappable source (arc_swap / DB routing table, §6/§26.5),
# never captured once at startup — wherever it makes sense and is actually useful.
# Container runtime: PODMAN ONLY (no Docker) — supersedes the plan's Docker mentions; use
# `podman` / `podman compose` everywhere (see CLAUDE.md "Container runtime — Podman only").


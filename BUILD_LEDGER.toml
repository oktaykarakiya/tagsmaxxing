plan_sections = ["20", "12"]
acceptance = "GET file → 302 redirect to presigned B2 URL; URL works within TTL window, returns 403 after; LocalBlob presigned returns file:// path (unchanged); configurable TTL; download streams with correct Content-Type + Content-Disposition. Unit tests with mock B2 + integration test with real B2 (#[ignore]). just ci green."
status = "done"
checkpoint = false
notes = "Added blob_presigned_ttl to AppState (BLOB_PRESIGNED_TTL_SECS env, default 3600s); file_download now returns 302 redirect to presigned URL with Content-Type + Content-Disposition; extracted build_redirect_response() for testability; 14 new tests (redirect shape, headers, mock blob, TTL config) — just ci green."

[[task]]
id = "P8-T4"
phase = "P8"
description = "Streaming multipart upload: for files larger than a configurable threshold (BLOB_MULTIPART_THRESHOLD_BYTES, default 5 MB), use S3 multipart upload via object_store's MultipartUpload API. Stream the source (user upload or pipeline output) directly into B2 parts — never buffer the full file in RAM. On failure, abort the multipart upload (clean up partial parts). Retry individual parts on transient errors (bounded, 3 attempts). Progress callback for UI polling. Works with both B2Blob (P8-T1) and LocalBlob (which just does a regular streaming put)."

description = "RLS connection-role enforcement rework (resolves the P6-T13 §31.5 blocker; design per docs/analysis/07-rls-enforcement-blocker.md, approved under the overnight-mandate delegation). Tenant isolation is currently a NO-OP (the connection role is a BYPASSRLS superuser, and the set_tenant GUC does not survive to the query). Implement the standard two-role model: (1) a migration creates `kb_app` (LOGIN NOSUPERUSER NOBYPASSRLS, owns nothing, granted DML on tenant tables — so RLS is enforced as defense-in-depth) and keeps a privileged `kb_admin`/owner role for migrations + the cross-tenant job queue + admin/usage roll-ups; (2) rework `set_tenant` and ALL ~20 tenant-scoped kb-store methods so the `app_set_current_tenant` GUC and the query run on the SAME pooled connection within the SAME transaction, with a reset-on-release guard so a pooled connection never leaks one tenant's GUC to the next checkout; (3) route the job queue (JobQueue::claim and worker pool) + admin/usage paths through the privileged role; (4) wire both DB roles/URLs through kb-config (hot-swappable per CLAUDE.md) and compose.yaml; (5) update the testcontainers harness to seed via the privileged role and run tenant-data assertions via `kb_app`; (6) fix bug 5 (p4 create_test_document sha256 uniqueness / ON CONFLICT) and make the harness reliable (share one pgvector container per test binary to stop churn timeouts, finding 06-B). Then make the §31.5 cross-tenant isolation suite genuinely GREEN UNDER kb_app — not the superuser."

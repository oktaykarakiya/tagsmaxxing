description = "Auth middleware + API handlers: (a) axum middleware that extracts the session cookie, validates it via Arc<dyn SessionStore>, and injects (tenant_id, user_id, UserRole) into request extensions (or rejects with 401). (b) Axum handlers for POST /auth/login (verify password → create session → Set-Cookie), POST /auth/register (hash password → INSERT user → create session), POST /auth/logout (revoke session → clear cookie). (c) PgStore methods for user CRUD: create_user, find_user_by_email (per tenant). (d) bootstrap-seed: on first run, if no tenants exist, create a default tenant + admin user from env vars (BOOTSTRAP_ADMIN_EMAIL, BOOTSTRAP_ADMIN_PASSWORD)."
depends_on = ["P5-T4", "P5-T1"]
plan_sections = ["13", "12"]
acceptance = "Middleware: valid cookie → extensions populated; missing/expired → 401. Login: correct password → 200 + Set-Cookie; wrong password → 401. Register: new email → 201 + session; duplicate email → 409. Logout: clears cookie + revokes session. Bootstrap: first run with env vars → tenant + admin user created; second run is idempotent. Unit tests (mock SessionStore for middleware/handlers, real argon2 for login/register) + integration tests (#[ignore] for DB-reliant handlers). just ci green."
status = "todo"
checkpoint = true
notes = "CHECKPOINT (§31.5): AUTH & SESSIONS — human review required."

[[task]]
id = "P5-T6"
phase = "P5"
description = "Per-tenant quota enforcement: (a) on blob upload, sum files.size_bytes for the tenant and check against tenants.quota_bytes (reject with 413 Payload Too Large + clear message if exceeded). (b) On LLM call, sum usage_events (prompt_tokens + completion_tokens) in the current billing period and check against tenants.quota_tokens (reject with 429 + Retry-After if exceeded). Both checks are advisory (best-effort, not transactional — a concurrent upload may briefly exceed the cap). NULL quotas = unlimited. Pure counting logic tested in unit; enforcement integration tested against Postgres."
depends_on = ["P5-T1", "P2-T1"]
plan_sections = ["13", "29", "15"]
acceptance = "Bytes quota: upload under limit succeeds, over limit gets 413 with clear message, unlimited (NULL) always succeeds. Token quota: LLM call under limit succeeds, over gets 429, NULL = unlimited. Edge case: multiple concurrent uploads don't panic, just may briefly overshoot (documented). Unit tests for count-check logic + #[ignore] integration tests against Postgres. just ci green."
status = "todo"
checkpoint = false
notes = ""

[[task]]
id = "P5-T7"
phase = "P5"
description = "Export (data portability): a job-driven streaming ZIP + JSONL export per plan §13. Given a tenant_id: (1) query all documents, files, tags, document_tags, and chunks for the tenant, (2) write a streaming ZIP containing: original blobs (from Blob::get, preserving original paths), an export.jsonl (one JSON object per line: {type: \"document\"|\"file\"|\"tag\"|\"chunk\", data: {...}}), and a manifest.json ({schema_version: 1, embedder_id: \"bge-m3\", embedder_dim: 1024, exported_at, tenant_slug, document_count, file_count, total_bytes}). Uses async-streaming: never buffers the full export in memory. Integrates with the job queue (enqueue export job → worker claims → streams ZIP to a local temp file → stores blob → marks done). Round-trippable: a matching import path reads the same format."
depends_on = ["P5-T1", "P2-T3", "P2-T1"]
plan_sections = ["13", "16"]
acceptance = "Export creates a valid ZIP with original files + JSONL + manifest; streaming doesn't OOM on large exports; ZIP entry paths are stable (no absolute paths, no traversal); empty tenant → valid ZIP with just manifest.json; round-trip: export a tenant → import into fresh tenant → documents/files/tags/chunks match. Unit tests for JSONL/manifest generation + #[ignore] integration test for full export round-trip via testcontainers. just ci green."
status = "todo"
checkpoint = false
notes = ""


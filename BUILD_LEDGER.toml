id = "P8-T3"
phase = "P8"
description = "Presigned download URLs: the B2 blob backend returns time-limited (configurable, default 1 hour) presigned GET URLs from presigned_get_url(). Wire this into the API's file download endpoint (GET /api/documents/:id/file/:file_id → 302 redirect to presigned URL) so download bandwidth bypasses the app server entirely. For LocalBlob (dev), presigned returns a `file://` path as before (P2-T1). Configurable presigned TTL via BLOB_PRESIGNED_TTL_SECS (env, default 3600)."

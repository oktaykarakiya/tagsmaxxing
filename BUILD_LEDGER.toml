# ── Phase P8 — Storage + resilience (§20, §21, §22, §23, §25) ────────────────
#
# P8 replaces the local-disk Blob with Backblaze B2 (S3-compatible via object_store),
# adds envelope encryption + local read-through cache + presigned URLs, sets up
# pgBackRest continuous WAL/PITR with automated restore-testing, orchestrates
# multi-replica serving behind Caddy + PgBouncer, implements graceful degradation,
# and adds periodic maintenance jobs (orphan GC, integrity scan, vacuum, re-embed).

[[task]]
id = "P8-T1"
phase = "P8"
description = "B2 blob backend: implement the core Blob trait using `object_store` with a Backblaze B2 S3-compatible endpoint. Content-addressed key layout (`{tenant_id}/{sha256_hex}`) — same as LocalBlob (P2-T1). Supports: put (streaming, idempotent via content-addressing), get (streaming), get_range (HTTP Range for byte slices), exists (HEAD), delete, presigned_get_url (time-limited download URL via B2's presigned mechanism). Configured via env vars: B2_APPLICATION_KEY_ID, B2_APPLICATION_KEY, B2_BUCKET_NAME, B2_ENDPOINT (default s3.us-west-004.backblazeb2.com). Hot-swappable endpoint + credentials (ArcSwap reload from env/file-notify). Multipart upload for files > 5 MB (streaming, never buffers full file in RAM). Also configure/document B2 bucket VERSIONING + Object Lock + lifecycle version-expiry on the data bucket (§20/§21: ransomware + accidental-delete protection), and use a least-privilege application key scoped to this bucket only, separate from the backup-bucket key (§24)."
depends_on = ["P2-T1"]
plan_sections = ["20"]
acceptance = "put → get returns identical bytes; get_range returns correct byte slice; exists returns true after put, false after delete; presigned_get_url is valid and time-limited; same content → same key → idempotent put (no error); multipart upload for 50 MB file works; B2 unreachable → clear anyhow error (not panic); hot-swap credentials picks up new key without restart. Unit tests with a mock S3 server (or object_store's in-memory backend) + integration tests against real B2 (#[ignore] in just ci). just ci green."
status = "done"
checkpoint = false
notes = "B2Blob (kb-store::b2_blob) implements Blob trait via object_store 0.13.2 (aws feature) with AmazonS3 → B2 S3-compatible endpoint. Hot-swappable config (B2Config behind ArcSwap), content-addressed key layout ({tenant_id}/{sha256_hex}), multipart upload for >5MB payloads, presigned GET URLs via S3 SigV4 signing. 18 unit tests pass (config/construction/reload/os_path/constants), 9 #[ignore] integration tests for real S3 endpoint. Added object_store + reqwest deps. just ci green."

[[task]]
id = "P8-T2"
phase = "P8"
description = "Local read-through cache for B2 blobs (§20): a size-capped on-disk LRU cache. On get(): check local cache → hit → return cached bytes (validate SHA256 if paranoid mode); miss → fetch from B2 → store in cache → return. On put(): write to B2 first, then cache (write-through). Cache eviction: LRU, total size ≤ BLOB_CACHE_MAX_GB (env, default 10 GB). Cache stores decrypted plaintext only (encryption is above this layer, P8-T5). Metadata tracked in a SQLite or sled DB for fast lookup without filesystem scans. The cache is disposable — clearing it only causes re-fetches."
depends_on = ["P8-T1"]
plan_sections = ["20"]
acceptance = "First get → B2 fetch (cache miss); second get → cache hit (no B2 call); put → B2 + cache; eviction removes least-recently-used entries; total cache size stays under limit; cache clear → subsequent get re-fetches; SHA256 validation catches corrupted cache entries. Unit tests with mock B2 backend + temp dir. just ci green."
status = "done"
checkpoint = false
notes = "BlobCache in kb-store::blob_cache: wraps any Blob impl with SQLite-backed LRU cache (bundled rusqlite 0.32), monotonic access_seq for deterministic LRU ordering (no wall-clock flakiness), SHA256-validated paranoid mode, write-through put with best-effort cache (log+warn on cache failure after backend success), two-level hash-based file naming, WAL mode, clear() empties both DB+files. 32 unit tests: construction, cache miss→fetch→cache→hit, write-through put, delete both-sides, clear+re-fetch, eviction under limit + LRU-order, paranoid validation + corruption detection, exists/get_range/presigned delegation, file_path determinism, size tracking. just ci green (blob_cache.rs 93.79% lines)."


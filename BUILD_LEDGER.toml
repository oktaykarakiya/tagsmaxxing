status = "done"
checkpoint = true
notes = "Two-role RLS DONE + §31.5 isolation SIGNED OFF (verified under kb_app, not the superuser). (1) migration 0006 creates kb_app LOGIN NOSUPERUSER NOBYPASSRLS, DML on the 9 tenant tables only (not tenants/sessions/settings); privileged role keeps migrations+queue+admin. (2) PgStore now has admin_pool+app_pool; set_tenant->begin_tenant_tx wraps all ~20 tenant methods + hybrid_search in ONE tx that sets app.current_tenant transaction-locally on the query connection (reset-on-release, no GUC leak). (3) queue/session/tenants/quota-limit lookups use the admin pool. (4) storage.app_postgres_url / APP_POSTGRES_URL wired (hot-swappable) + compose/.env. (5) new kb-testsupport crate: ONE pgvector container per test binary + fresh DB per test (fixes 06-B churn; also fixed a sqlx cross-runtime-pool footgun); suites seed via admin, assert via kb_app tenant_tx. (6) bug5 fixed (unique per-file sha in p4 + hybrid_search fixtures); mock-backend gained an opt-in per-input hashed-embedding mode so canonicalizer fixtures keep N distinct tags at VECTOR(1024). VERIFIED on real pgvector via Podman: doc-07 Probe1=0; all 9 cross_tenant_isolation tests + P5 E2E isolation green UNDER kb_app; just ci-integration GREEN end-to-end (overall 92.90%, kb-store 92.46%, auth 95.18% >=85) and reliable on rerun. Fast just ci green (cov 77.26%>=76). Resolves blocked P6-T13; see docs/analysis/07 Resolution."


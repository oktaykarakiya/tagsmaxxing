status = "done"
checkpoint = false
notes = "Added ProviderApiKey (Zeroizing container, redacted Debug/Display); encrypt/decrypt_provider_key delegating to KEK; api_key_enc on ProviderRow; set_provider_api_key (encrypt-on-write) + decrypt_provider_api_key (call-time decrypt) on PgStore; zeroize + log-redaction tests; updated all ProviderRow constructions. just ci green."

[[task]]
id = "P10-T4"
phase = "P10"
description = "Crypto-shredding (§28): on tenant delete (super-admin action) or document delete, destroy the tenant/document DEK. This makes all encrypted data (B2 blobs, DB encrypted columns) irrecoverable — even from B2 immutable versions and PITR backups, which can't be selectively purged. Implementation: (a) tenant delete → DELETE the tenant's DEK from the key store (Vault/KMS or file) → data is unrecoverable. Keep a tombstone record (tenant_id, deleted_at) for audit. (b) Document delete: if per-document keys are used, delete that doc's key. If using tenant-level DEK, document delete only removes the DB row + B2 blob — crypto-shredding is at tenant granularity. (c) GDPR erasure request → tenant delete = crypto-shred. Implement as a job queue task (delete_tenant job: revoke sessions, delete DB rows, delete B2 blobs, destroy DEK, create tombstone)."
depends_on = ["P10-T1", "P5-T1"]
plan_sections = ["28"]
acceptance = "Tenant delete job: sessions revoked, DB rows removed, B2 blobs deleted, DEK destroyed, tombstone created; after DEK destruction, B2 ciphertext is unrecoverable (verify by attempting decrypt with new KEK → fails); tombstone audit log records who + when; job is idempotent (re-running on already-deleted tenant is a no-op). Unit tests with mock KEK + mock B2. just ci green."
status = "done"
checkpoint = false
notes = "Migration 0016 (tenant_tombstones + delete_tenant job kind), TenantTombstone type, CryptoShredPipeline (CryptoShredStore/CryptoShredSessionStore/CryptoShredBlobStore traits + process_delete_tenant_job handler), PgStore shred methods (destroy_tenant_dek, delete_tenant_data, create_tombstone, tenant_exists), session revoke_all_for_tenant on both stores. 10 unit tests with mock stores. just ci green."


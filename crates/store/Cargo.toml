[package]
name = "kb-store"
description = "Store implementation: Postgres + pgvector (sqlx). Hybrid search lives here."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# sqlx: Postgres connection pool, migrate! for embedded schema, chrono for DateTime<Utc>
# support in queries, and the runtime-tokio/postgres driver.
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono"] }
# Core domain types (FileRecord, Chunk, Query, Hit) and the Store trait.
kb-core = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
# S3-compatible object store (Backblaze B2, plan §20)
object_store = { workspace = true, features = ["aws"] }
# Used for Signer::signed_url method parameter types
reqwest = { workspace = true }
# Hot-swappable postgres_url (the hot-swap rule, CLAUDE.md).
arc-swap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync"] }
chrono = { workspace = true }
# SQLite for blob cache metadata (plan §20, P8-T2)
rusqlite = { workspace = true }
# SHA256 hashing for cache validation and file path derivation
sha2 = { workspace = true }
hex = { workspace = true }
# Logging for cache write warnings and routing hot-reload (P9-T7)
tracing = { workspace = true }
# AES-256-GCM for EncryptedBlob envelope encryption (plan §20/§24, P8-T5)
aes-gcm = { workspace = true }
# CSPRNG for DEK/nonce generation (plan §24, P8-T5)
rand = { workspace = true }
# Serde for VaultTransitKek API types (plan §28, P10-T1)
serde = { workspace = true }
# Base64 for Vault Transit API plaintext encoding (plan §28, P10-T1)
base64 = { workspace = true }
# UUID for DataKey integration tests (plan §28, P10-T1)
uuid = { workspace = true }
# Stream combinators for listing blobs (plan §23, P8-T10)
futures = { workspace = true }
# Prometheus metrics for budget/cost gauges (plan §26.6, P9-T10)
kb-metrics = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "net"] }
testcontainers = { workspace = true }
tempfile = { workspace = true }
chrono = { workspace = true }
# Shared #[ignore] integration harness: one pgvector container per binary + the two RLS roles.
kb-testsupport = { workspace = true }
# Mock HTTP server for test_connection tests.
kb-mock-backend = { workspace = true }
# In-process HTTP server for mock Vault Transit tests (plan §28, P10-T1)
axum = "0.8"

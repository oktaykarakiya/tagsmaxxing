[package]
name = "kb-store"
description = "Store implementation: Postgres + pgvector (sqlx). Hybrid search lives here."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# `sqlx::migrate!` embeds the forward-only schema migrations under ./migrations into the
# binary; the runtime `Migrator` applies them. The store impl proper lands in P4.
sqlx = { workspace = true }
# Local-disk Blob impl (P2-T1): content-addressed file storage behind the core Blob trait.
# Hot-swappable root directory via arc-swap (the hot-swap rule, CLAUDE.md / §20).
kb-core = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
arc-swap = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }
testcontainers = { workspace = true }
tempfile = { workspace = true }

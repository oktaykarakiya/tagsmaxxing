[package]
name = "kb-pipeline"
description = "Wires extract -> models -> store for the ingest and query flows."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
kb-core = { workspace = true }
kb-store = { workspace = true }
kb-llm = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "chrono"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "process", "rt"] }
futures = { workspace = true }
tree_magic_mini = { workspace = true }
zip = { workspace = true }
tempfile = { workspace = true }
arc-swap = { workspace = true }
notify = { workspace = true }
kb-metrics = { workspace = true }
kb-config = { workspace = true }
kb-logging = { workspace = true }
image = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
testcontainers = { workspace = true }
kb-store = { workspace = true }
kb-mock-backend = { workspace = true }
kb-scheduler = { workspace = true }
reqwest = { workspace = true }
# Shared #[ignore] integration harness: one pgvector container per binary + the two RLS roles.
kb-testsupport = { workspace = true }
filetime = "0.2"

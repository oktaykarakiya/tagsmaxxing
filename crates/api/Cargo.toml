[package]
name = "kb-api"
description = "axum HTTP API + clap CLI + folder-watch + web UI. Serves on port 9999."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
kb-core = { workspace = true }
kb-config = { workspace = true }
kb-store = { workspace = true }
kb-llm = { workspace = true }
kb-scheduler = { workspace = true }
kb-pipeline = { workspace = true }
kb-extract = { workspace = true }
kb-metrics = { workspace = true }
# axum 0.8: the current stable line. Works with tokio 1.x and edition 2024.
axum = { version = "0.8", features = ["multipart"] }
clap = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "net", "signal"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["json"] }
anyhow = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
bytes = { workspace = true }
sqlx = { workspace = true }
askama = { workspace = true }
tower-http = { workspace = true, features = ["fs"] }
rand = { workspace = true }

[dev-dependencies]
kb-mock-backend = { workspace = true }
kb-testsupport = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "rt-multi-thread"] }
tower = "0.5"
tempfile = { workspace = true }
async-trait = { workspace = true }
serde_urlencoded = "0.7"

[[bin]]
name = "kb"
path = "src/main.rs"

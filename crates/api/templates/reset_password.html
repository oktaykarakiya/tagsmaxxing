{% extends "base.html" %}

{% block title %}Reset password{% endblock %}

{% block content %}
<div class="flex min-h-[80vh] items-center justify-center">
    <div class="w-full max-w-md space-y-8 rounded-xl bg-white p-8 shadow-lg">
        <div>
            <h2 class="text-center text-2xl font-bold tracking-tight text-gray-900">
                Set a new password
            </h2>
            <p class="mt-2 text-center text-sm text-gray-500">
                Enter your new password below.
            </p>
        </div>

        {% if !error.is_empty() %}
        <div class="rounded-md bg-red-50 p-4 border border-red-200">
            <p class="text-sm text-red-800">{{ error }}</p>
        </div>
        {% endif %}

        <form class="mt-8 space-y-6" method="post" action="/reset?token={{ token }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="reset_token" value="{{ token }}">

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">
                    New password
                </label>
                <input id="password" name="password" type="password" autocomplete="new-password" required
                       minlength="8"
                       class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 sm:text-sm">
                <p class="mt-1 text-xs text-gray-500">At least 8 characters.</p>
            </div>

            <button type="submit"
                    class="flex w-full justify-center rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition">
                Reset password
            </button>
        </form>

        <p class="text-center text-sm text-gray-500">
            <a href="/login" class="font-medium text-indigo-600 hover:text-indigo-500">
                Back to login
            </a>
        </p>
    </div>
</div>
{% endblock %}

<html lang="en" class="h-full">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Local KB{% endblock %} — File Knowledge Base</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% block head_extra %}{% endblock %}
</head>
<body class="h-full bg-gray-50 text-gray-900">
    <div class="bg-amber-100 border-b-2 border-amber-400 text-center text-sm text-amber-900 py-2.5 px-4 font-medium">

        Do not rely on it for real data. Everything may change.
    </div>
    {% block content %}{% endblock %}

</body>
</html>

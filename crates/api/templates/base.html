<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Local KB{% endblock %} — File Knowledge Base</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% block head_extra %}{% endblock %}
</head>
<body class="h-full bg-gray-50 text-gray-900">
    <div class="bg-yellow-50 border-b border-yellow-200 text-center text-xs text-yellow-700 py-1.5 px-4">
        <span class="font-medium">⚠ Experimental pre-release —</span>
        in active development. Not yet ready for production use. Features and data formats may change.
    </div>
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>

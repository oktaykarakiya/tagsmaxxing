[package]
name = "kb-scheduler"
description = "Multi-host, slot-aware model scheduler (acquire/lease/failover) — the centerpiece."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
kb-core = { workspace = true }
kb-config = { workspace = true }
# Only the `sync` feature is needed here (Semaphore / OwnedSemaphorePermit); the
# workspace default is feature-less. Async runtime features arrive with `acquire` (P1-T2).
tokio = { workspace = true, features = ["sync", "time"] }
dashmap = { workspace = true }
thiserror = { workspace = true }
# Futures meta-crate for FuturesUnordered in the wait path (plan §6.3).
futures = "0.3"

[package]
name = "kb-extract"
description = "Extractor implementations: native docs, Tika, media (ffmpeg/whisper), vision."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
kb-core = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
exif = { package = "kamadak-exif", version = "0.6.1" }
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }

[dev-dependencies]
axum = "0.8"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync"] }

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant — TagsMaxxing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
</head>
<body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-2xl font-bold">AI Assistant</h1>
            <p class="text-gray-500 dark:text-gray-400 text-sm">Model: {{ model_ref }}</p>
        </div>

        <!-- Main layout: output log + input -->
        <div class="space-y-6">
            <!-- Output log -->
            <div id="output-log"
                 class="bg-gray-100 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg p-4 h-96 overflow-y-auto font-mono text-sm"
                 hx-ext="sse"
                 sse-connect="/assistant/prompt"
                 sse-swap="message"
                 hx-swap="beforeend">
                <p class="text-gray-500 dark:text-gray-600">Waiting for a prompt...</p>
            </div>

            <!-- Prompt input form -->
            <form id="prompt-form"
                  hx-post="/assistant/prompt"
                  hx-target="#output-log"
                  hx-swap="innerHTML"
                  hx-indicator="#spinner"
                  class="flex gap-2">
                <input type="text"
                       name="text"
                       placeholder="Ask the assistant anything..."
                       required
                       class="flex-1 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-3 text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-lg transition-colors">
                    Send
                </button>
                <div id="spinner" class="htmx-indicator">
                    <div class="animate-spin h-5 w-5 border-2 border-blue-400 border-t-transparent rounded-full"></div>
                </div>
            </form>

            <!-- Kill button -->
            <div class="flex justify-end">
                <button id="kill-btn"
                        onclick="fetch('/assistant/kill', {method:'POST'})"
                        class="text-red-600 dark:text-red-400 hover:text-red-500 dark:hover:text-red-300 text-sm underline">
                    Kill running session
                </button>
            </div>

            <!-- Session info (HTMX partial) -->
            <div id="session-info"
                 hx-get="/assistant/sessions"
                 hx-trigger="load"
                 hx-swap="innerHTML">
            </div>
        </div>
    </div>

    <script>
        // Clear output log on new prompt
        document.getElementById('prompt-form').addEventListener('htmx:beforeRequest', function() {
            document.getElementById('output-log').innerHTML =
                '<p class="text-gray-500 dark:text-gray-600">Running...</p>';
        });
    </script>
</body>
</html>

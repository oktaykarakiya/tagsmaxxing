[package]
name = "kb-llm"
description = "OpenAI-compatible client routing through the scheduler with failover and circuit-breaking (plan §6.4)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Opt-in Anthropic Messages API adapter (plan §26.1). The default binary excludes
# it so the build stays lean; `cargo test --all-features` always exercises it.
anthropic = []

[dependencies]
kb-core = { workspace = true }
kb-scheduler = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
kb-mock-backend = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
axum = "0.8"

id = "BUG-INGEST-15"
description = "OOXML office docs route to Archive not Document, and minimal JARs bypass the executable deny-list (campaign findings F1, F10) — CHECKPOINT (extractor untrusted-bytes boundary)"
test_names = ["classify_zip_ooxml_flavours", "jar_marked_zip_is_denied", "ooxml_marked_zip_is_allowed_as_document", "detect_mime_refines_ooxml_zip_to_office_document", "detect_mime_refines_jar_zip_to_java_archive"]
test_file = "crates/extract/src/security.rs"
touches = ["crates/extract/src/security.rs", "crates/pipeline/src/document_builder.rs"]
conflict_group = "extract"
depends_on = []
severity = "medium"
status = "done"
acceptance = "a .docx/.xlsx/.pptx (ZIP + [Content_Types].xml) is detected as its OOXML MIME → DocKind::Document (Tika), not Archive; a .jar (ZIP + META-INF/MANIFEST.MF) is detected as application/java-archive and rejected 400 at the upload edge"
notes = "Campaign F1+F10. CHECKPOINT (extractor untrusted-bytes boundary) — implemented+tested, surfaced for review, NOT merged to main. tree_magic_mini reports OOXML docs and JARs as plain application/zip, so office docs got DocKind::Archive (wrong kind; Tika still extracted) and minimal JARs were accepted as archives (deny-list bypass). Fix: classify_zip_container(bytes) does a bounded (64 KiB), allocation-free, read-only substring scan for [Content_Types].xml (→ OOXML MIME, disambiguated by word/|xl/|ppt/) and META-INF/MANIFEST.MF (→ application/java-archive, deny-listed). Wired into BOTH detectors that must stay in step: kb_extract::security::detect_upload_mime (the upload-edge allow/deny) AND kb_pipeline::document_builder::detect_mime (the stored DocKind). Pure widening of detection + tightening of the deny path; bytes still cross the sandboxed Tika boundary. Unit tests in both crates; e2e test_ingest_formats jar→400 + docx→document. document_builder.rs is in the ingest_pipeline group (cross-group fix, documented here)."

[[bug]]
id = "BUG-INGEST-14"
description = "Non-media ingest returns 500 (not 503) when the LLM tagger backend is unavailable (campaign finding F4)"
test_names = ["is_backend_unavailable_classifies_llm_errors", "non_media_backend_down_returns_backend_unavailable", "tag_preserves_typed_scheduler_error", "map_ingest_error_backend_unavailable_is_503", "ensure_retry_after_sets_header_on_429_and_503"]
test_file = "crates/pipeline/src/ingest.rs"
touches = ["crates/llm/src/tagger.rs", "crates/pipeline/src/ingest.rs", "crates/pipeline/src/lib.rs", "crates/api/src/handlers/ingest.rs", "crates/api/src/commands/serve.rs"]
conflict_group = "ingest_pipeline"
depends_on = []
severity = "medium"
status = "done"
acceptance = "when the tagger has no healthy backend, a non-media upload returns 503 service_unavailable + Retry-After (not 500); media still degrades to 202; a genuine internal error still returns 500"
notes = "Campaign F4. The tagger stringified scheduler errors (anyhow!(\"...: {e}\")) so the typed AcquireError/LlmError was lost, and the non-media pipeline branch returned a generic error → 500 — turning a transient backend outage into a hard failure (the single largest source of campaign test flakiness). Fix (cross-group, sequential): (1) tagger.rs preserves the typed LlmError via anyhow::Error::new(e).context(...) at both chat() call sites; (2) pipeline/ingest.rs adds typed IngestError::BackendUnavailable + is_backend_unavailable(&anyhow::Error) (matches LlmError::Scheduler/AllCooldown/AllFailed) and returns it for non-media tagger outages (media still degrades to default metadata; other errors still 500); (3) handlers/ingest.rs::map_ingest_error downcasts IngestError → 503 service_unavailable with a generic client message (no internal leak); (4) serve.rs ensure_retry_after_on_429 → ensure_retry_after now tags 429 AND 503 with Retry-After:5. Unit tests across kb-llm/kb-pipeline/kb-api. Primary group ingest_pipeline; also touches tagger/api_handlers/serve_config (documented)."

[[bug]]
id = "BUG-INGEST-16"
description = "Audio extractor deadlocks on any real audio — ffmpeg stdin/stdout pipe deadlock hangs ingest + leaks the inflight permit (campaign finding F8) — CHECKPOINT (extractor untrusted-bytes boundary)"
test_names = ["real_ffmpeg_transcodes_large_audio_without_deadlock"]
test_file = "crates/extract/src/audio.rs"
touches = ["crates/extract/src/audio.rs"]
conflict_group = "extract"
depends_on = []
severity = "high"
status = "done"
acceptance = "transcoding audio whose re-encoded WAV exceeds the ~64 KiB stdout pipe buffer completes within the timeout instead of hanging; audio ingest no longer wedges or leaks inflight permits"
notes = "Campaign F8 (HIGH). CHECKPOINT (extractor untrusted-bytes boundary, §31.5) — implemented+tested, committed on the branch for review, NOT merged to main. RealFfmpeg::transcode fed input to ffmpeg's stdin (pipe:0) and only read stdout AFTER write_all finished; once ffmpeg's ~64 KiB stdout pipe filled it blocked writing, stopped draining stdin, and write_all blocked forever (outside the timeout) — so any real audio (>~2 s) hung >200 s and never released its inflight permit. Fix: adopt the video extractor's safe pattern — write input to a tempfile::NamedTempFile and run `ffmpeg -i <tmp> -ar 16000 -ac 1 -f wav pipe:1` with stdin(Stdio::null()), reading stdout under the existing timeout. Added RealFfmpeg::temp_file. Mock-transcoder unit tests unchanged (27 pass); added an #[ignore] real-ffmpeg regression (3 s WAV → >64 KiB out) — verified live on ffmpeg 8.1.1: completes in ~0.14 s (was a >200 s hang). Added audio.rs + video.rs to the extract conflict group."

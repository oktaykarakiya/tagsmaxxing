[[bug]]
id = "BUG-INGEST-06"
description = "Zero-byte file upload not cleanly rejected with 400"
test_names = ["test_zero_byte_file_rejected"]
test_file = "tests/catalog/test_kb_correctness.py"
touches = ["crates/extract/src/security.rs", "crates/api/src/handlers/ingest.rs", "crates/extract/Cargo.toml"]
conflict_group = "extract"
depends_on = []
severity = "low"
status = "done"
acceptance = "test_zero_byte_file_rejected passes"
notes = "DONE (with BUG-INGEST-07, same fix): introduced a typed UploadRejected error (thiserror) in crates/extract/src/security.rs; validate_file_size/validate_file_path/validate_mime now return it (messages preserved so existing assertions hold). A 0-byte upload detects as application/x-empty -> not allow-listed -> UploadRejected::DisallowedMime. In crates/api/src/handlers/ingest.rs, new map_ingest_error downcasts UploadRejected -> 400 bad_request (else 500), replacing the blanket .map_err(internal_error) on process_upload_inline (mirrors the QuotaError->413 downcast). Added thiserror dep to kb-extract. Tests: security::rejections_downcast_to_upload_rejected + handlers::ingest::upload_rejection_maps_to_400_else_500. CHECKPOINT (extractor untrusted-bytes boundary) — flagged for human review. just ci green. Original analysis follows: A 0-byte upload is ALREADY rejected, just with the wrong status: verified live that POST /api/ingest of a 0-byte file returns 500 internal_error (not 400). Root cause is the HTTP layer, not the pipeline. The JSON handler crates/api/src/handlers/ingest.rs::process_upload_inline calls security::validate_upload FIRST, which rejects empty bytes because detect_upload_mime(b\"\")=\"application/x-empty\" is not in ALLOWED_MIMES (see existing unit test security.rs::empty_bytes_validated). That anyhow error is then mapped via .map_err(internal_error) -> 500; only QuotaError is downcast to a 4xx. Consequences: (a) IngestPipeline::ingest is never reached for a 0-byte file because validate_upload runs before it, so any zero-byte check added to pipeline/ingest.rs is dead code; (b) the 500-vs-400 decision lives in handlers/ingest.rs and the rejection itself in extract/src/security.rs, both OUTSIDE the permitted set. Real fix: in crates/api/src/handlers/ingest.rs, return bad_request (400) for the empty-file/upload-validation rejection instead of internal_error -- e.g. an explicit 0-byte check before process_upload_inline, or have validate_upload surface a typed UploadRejected error the handler downcasts to 400 (mirrors the QuotaError->413 pattern). Re-scope touches to include crates/api/src/handlers/ingest.rs (+ optionally crates/extract/src/security.rs). The sibling bug BUG-INGEST-07 (test_mime_magic_mismatch_rejected) shares the same structural blocker."

[[bug]]
id = "BUG-INGEST-07"
description = "MIME/magic byte mismatch not rejected"
test_names = ["test_mime_magic_mismatch_rejected"]
test_file = "tests/catalog/test_kb_correctness.py"
touches = ["crates/extract/src/security.rs", "crates/api/src/handlers/ingest.rs"]
conflict_group = "extract"
depends_on = []
severity = "low"
status = "done"
acceptance = "test_mime_magic_mismatch_rejected passes"
notes = "DONE (fixed together with BUG-INGEST-06 — same root cause/fix): ELF magic bytes detect as application/x-executable (in DENIED_MIMES) -> validate_mime returns the new typed UploadRejected::DisallowedMime, which crates/api/src/handlers/ingest.rs::map_ingest_error now downcasts to 400 (was 500). See BUG-INGEST-06 notes for full detail. CHECKPOINT (untrusted-bytes boundary) — flagged for review. just ci green. Original analysis: The ELF-magic file IS already rejected — just with the wrong status (500, not 4xx) — and the binary extractor is never reached. Verified empirically: tree_magic_mini 3.2.2 detects the test bytes (\\x7fELF\\x02\\x01\\x01\\x00 + 56 NULs) as application/x-executable, which is in security.rs::DENIED_MIMES. Runtime path: POST /api/ingest -> handlers::ingest::ingest -> process_upload_inline, which calls security::validate_upload FIRST; validate_mime rejects application/x-executable (anyhow error) BEFORE IngestPipeline::ingest runs, so the extractor router never dispatches to BinaryExtractor. That error is then mapped via .map_err(internal_error) -> 500; only QuotaError is downcast to a 4xx. Two consequences: (a) any magic/MIME check added to binary.rs is dead code (the file never reaches that extractor); (b) even if it did and returned Err, the pipeline error still becomes 500, not the required 4xx. The rejection lives in crates/extract/src/security.rs and the 500-vs-400 decision in crates/api/src/handlers/ingest.rs — both OUTSIDE the permitted set. Same structural blocker called out in BUG-INGEST-06's note. Real fix: in crates/api/src/handlers/ingest.rs return bad_request (400) for upload-validation rejections (e.g. surface a typed UploadRejected error from validate_upload and downcast it, mirroring the QuotaError->413 pattern). Re-scope touches to include crates/api/src/handlers/ingest.rs (+ optionally crates/extract/src/security.rs)."


# BUG_LEDGER.toml — autonomous bug-fix pipeline ledger
#
# Each [[bug]] encodes one fixable defect surfaced by the E2E test suite.
# Bugs in DIFFERENT conflict groups touch disjoint sets of source files and can be
# fixed in parallel by dedicated Claude Code instances. Bugs in the SAME group
# serialize.
#
# Generated: 2026-06-03
# Baseline:   to be captured (run ./test/run.sh first)
# Excludes:   Stripe-dependent, SMTP-dependent, Backblaze B2-dependent bugs


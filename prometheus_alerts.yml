# Prometheus alert rules for the Local File Knowledge Base (plan §26.6, P9-T10).
#
# These rules fire on per-tenant budget thresholds using the kb_tenant_* gauges
# exported by kb-metrics.  Deploy alongside your Prometheus server config (e.g.
# add to rule_files: in prometheus.yml).

groups:
  - name: kb_budget
    rules:
      # ── Budget warnings (≥ 80% consumed) ──
      - alert: BudgetOver80Percent
        expr: |
          (
            kb_tenant_spend_monthly_micros
            /
            (kb_tenant_budget_cents * 10000)
          ) >= 0.8
          and
          kb_tenant_budget_cents > 0
        for: 5m
        labels:
          severity: warning
          category: budget
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} monthly spend ≥ 80% of budget"
          description: >
            Tenant {{ $labels.tenant_id }} has spent
            {{ $value | humanizePercentage }} of its monthly budget.
            Current spend: {{ printf "%.2f" (query "kb_tenant_spend_monthly_micros{tenant_id=\"$labels.tenant_id\"}" | first | value | parseFloat / 1000000) }} USD.
            Budget: {{ printf "%.2f" (query "kb_tenant_budget_cents{tenant_id=\"$labels.tenant_id\"}" | first | value | parseFloat / 100) }} USD.

      # ── Budget exceeded (≥ 100% consumed) ──
      - alert: BudgetExceeded
        expr: kb_tenant_budget_exceeded == 1
        for: 1m
        labels:
          severity: critical
          category: budget
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} monthly spend has exceeded its budget"
          description: >
            Tenant {{ $labels.tenant_id }} has exceeded its monthly budget.
            Spend: {{ printf "%.2f" (query "kb_tenant_spend_monthly_micros{tenant_id=\"$labels.tenant_id\"}" | first | value | parseFloat / 1000000) }} USD.
            This is a SOFT cap unless TENANT_HARD_BUDGET_CAP=true.

  # Runtime health + limit/quota signals revived in P14 (plan §15). These fire on
  # the per-second rejection rates and runtime gauges exported by kb-metrics.
  - name: kb_limits_runtime
    rules:
      # ── Quota-rejection spike (plan §29) ──
      # A sustained rate of plan-quota rejections means tenants are hitting a cap
      # (storage|tokens|users) — investigate / prompt an upgrade.
      - alert: QuotaRejectionSpike
        expr: sum by (limit) (rate(kb_quota_rejections_total[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          category: limits
        annotations:
          summary: "Quota rejections spiking for limit {{ $labels.limit }}"
          description: >
            Plan-quota rejections for limit "{{ $labels.limit }}" are running at
            {{ printf "%.3f" $value }}/s (5m rate) for over 10m. One or more
            tenants are repeatedly hitting their {{ $labels.limit }} cap.

      # ── Rate-limit (429) spike (plan §29) ──
      # Distinguishes abuse (kind=login brute-force) from plan-cap throttling
      # (kind=plan). A high login rate signals a credential-stuffing attempt.
      - alert: RateLimitRejectionSpike
        expr: sum by (kind) (rate(kb_rate_limit_rejections_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
          category: limits
        annotations:
          summary: "429 rate-limit rejections spiking (kind {{ $labels.kind }})"
          description: >
            Rate-limit rejections of kind "{{ $labels.kind }}" are running at
            {{ printf "%.3f" $value }}/s (5m rate) for over 5m.
            kind=login indicates possible brute-force; kind=plan indicates a
            tenant is exceeding its per-minute plan cap.

      # ── Subsystem degraded (plan §22) ──
      - alert: SubsystemDegraded
        expr: kb_subsystem_degraded > 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Subsystem {{ $labels.subsystem }} is degraded"
          description: >
            The "{{ $labels.subsystem }}" subsystem has reported a degraded state
            for over 2m. Serving is impaired (e.g. fallbacks / reduced functionality);
            check the dependency health and circuit-breaker gauges.

      # ── In-flight ingest saturation (plan §22) ──
      # The ingest concurrency limiter sheds load with 429s near its ceiling; a
      # sustained high in-flight count means ingest is saturated / backed up.
      - alert: InflightIngestSaturation
        expr: kb_inflight_ingest > 16
        for: 5m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "In-flight ingest saturated"
          description: >
            kb_inflight_ingest has stayed above 16 for over 5m (currently
            {{ $value }}). Ingest is saturated and requests may be throttled
            (429); check queue depth and oldest-job age.

      # ── Metering write failures (plan §15, §29) ──
      # Lost usage-accounting writes (fail-open buffer drops or durable-sink
      # errors). Any sustained rate means usage/billing data is being lost.
      - alert: MeteringWriteFailures
        expr: rate(kb_metering_write_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
          category: metering
        annotations:
          summary: "Usage-accounting writes are being lost"
          description: >
            kb_metering_write_failures_total has been increasing for over 5m
            ({{ printf "%.3f" $value }}/s). Usage events are being dropped
            (back-pressured buffer or a broken durable sink) — billing/quota
            accounting is now under-counting. Investigate the metering drain task.

      # ── Queued ingestion (plan §16, P15-T13) ──
      # The queue is backing up: more waiting work than workers can drain.
      # Scale workers (--scale worker=N / another machine) or investigate a
      # stuck model backend.
      - alert: IngestQueueDepthHigh
        expr: kb_queue_depth > 100
        for: 10m
        labels:
          severity: warning
          category: queue
        annotations:
          summary: "Ingest queue depth high"
          description: >
            kb_queue_depth has stayed above 100 for over 10m (currently
            {{ $value }}). Uploads are accepted (until the admission caps) but
            processing lags; add worker capacity or check model backends.

      # Head-of-line wait: the oldest queued job has waited too long — either
      # the queue is starved of workers or claims are failing.
      - alert: IngestQueueOldestJobStale
        expr: kb_queue_oldest_job_age_secs > 1800
        for: 5m
        labels:
          severity: warning
          category: queue
        annotations:
          summary: "Oldest queued job waiting > 30m"
          description: >
            The oldest queued job has been waiting {{ printf "%.0f" $value }}s.
            Workers may be down, saturated, or failing to claim.

      # Reaped leases mean workers crashed or stalled mid-job (heartbeats
      # stopped). Occasional singles can be a deploy; a sustained rate is a
      # crashing worker or a hung model call.
      - alert: WorkerLeaseReapSpike
        expr: increase(kb_job_leases_reaped_total[15m]) > 3
        for: 0m
        labels:
          severity: warning
          category: queue
        annotations:
          summary: "Worker leases being reaped"
          description: >
            {{ printf "%.0f" $value }} job leases were reaped in 15m — workers
            are dying or stalling mid-job. Check worker containers/processes
            and model-server stability.

      # Users are being turned away: bounded-queue admission is rejecting
      # uploads (429 queue_full). Sustained rejections mean capacity needs to
      # grow or the caps are mis-tuned.
      - alert: IngestQueueFullRejections
        expr: increase(kb_queue_full_rejections_total[10m]) > 10
        for: 0m
        labels:
          severity: warning
          category: queue
        annotations:
          summary: "Uploads rejected: ingest queue full"
          description: >
            {{ printf "%.0f" $value }} uploads were refused with 429 queue_full
            in 10m. Raise [ingest] caps only with matching worker capacity;
            otherwise scale workers.

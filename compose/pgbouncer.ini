;; PgBouncer connection pool configuration (plan §22, P8-T8).
;;
;; Mounted into the PgBouncer container at /etc/pgbouncer/pgbouncer.ini.
;; Uses transaction pooling — the only mode that works safely with
;; session-level features (prepared statements are disabled, SET commands
;; are reset between transactions).
;;
;; See compose.yaml for the matching environment variables.

[databases]

* = host=postgres port=5432

[pgbouncer]

;; Listen on all interfaces inside the compose network.
listen_addr = 0.0.0.0
listen_port = 6432

;; Authentication: the userlist.txt file contains the credentials PgBouncer
;; uses to authenticate connecting clients and to connect to Postgres.
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; ── Connection pooling ──────────────────────────────────────────────────
;; Transaction pooling: connections are returned to the pool after each
;; transaction completes. This is the correct mode for web applications
;; where a request holds a connection for the duration of one logical
;; operation (a few queries in one transaction), not across requests.
pool_mode = transaction

;; Maximum number of server connections to Postgres (per user/database pair).
default_pool_size = 20

;; Maximum number of client connections PgBouncer accepts.
max_client_conn = 200

;; How long an idle server connection stays open before PgBouncer closes it
;; (saves Postgres resources when traffic is low).
server_idle_timeout = 600

;; ── Logging ─────────────────────────────────────────────────────────────
log_connections = 1
log_disconnections = 1
stats_period = 60

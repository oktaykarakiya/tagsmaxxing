# cargo-deny configuration (schema: cargo-deny 0.19.x).
# Gate: `cargo deny check` — part of `just ci` and CI. Complements `cargo audit`.

[graph]
# Check the host/deploy targets we care about. (windows-* crates enter only via
# chrono -> iana-time-zone on Windows; their MIT/Apache-2.0 is allowed below.)
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
# RustSec defaults apply (known vulnerabilities -> error). Add IDs here only with a
# documented justification.
ignore = []

[licenses]
# Explicit allow-list; any dependency license not listed fails the gate.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = []
# Don't warn about allowed-but-not-yet-present licenses (the allow-list is forward-looking).
unused-allowed-license = "allow"

[licenses.private]
# Our own workspace crates are dual Apache-2.0/MIT (allowed); no special handling needed.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"            # forbid `*` version requirements in our manifests
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# cargo-deny configuration (schema: cargo-deny 0.19.x).
# Gate: `cargo deny check` — part of `just ci` and CI. Complements `cargo audit`.

[graph]
# Check the host/deploy targets we care about. (windows-* crates enter only via
# chrono -> iana-time-zone on Windows; their MIT/Apache-2.0 is allowed below.)
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
# RustSec defaults apply (known vulnerabilities -> error). Add IDs here only with a
# documented justification.
ignore = [
    # rustls-pemfile is unmaintained (repo archived Aug 2025), NOT a vulnerability.
    # It is pulled in transitively only by axum-server 0.7's `tls-rustls` feature
    # (our HTTPS listener); we never call it directly. The advisory states no safe
    # upgrade exists — the crate is now a thin wrapper over rustls-pki-types'
    # `PemObject`, which axum-server has not yet migrated to. Revisit/remove this
    # once axum-server ships a release that drops rustls-pemfile.
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained — transitive via axum-server tls-rustls
]

[licenses]
# Explicit allow-list; any dependency license not listed fails the gate.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    # First-party kb-* crates are AGPL-3.0-or-later (the project license). An AGPL
    # project may legally incorporate AGPL deps, so it is allow-listed for the workspace.
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.8
exceptions = []
# Don't warn about allowed-but-not-yet-present licenses (the allow-list is forward-looking).
unused-allowed-license = "allow"

[licenses.private]
# First-party kb-* workspace crates are AGPL-3.0-or-later (the project license).
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"            # forbid `*` version requirements in our manifests
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

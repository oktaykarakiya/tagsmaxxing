# compose.yaml — full stack for the Local File Knowledge Base (plan §14, P7-T2).
#
# Services (start unconditionally):
#   * app            — the kb binary (built from Containerfile, P7-T1)
#   * postgres       — pgvector/pgvector Postgres, the only durable state (plan §5)
#   * tika           — Apache Tika, document text/metadata extraction (plan §2)
#
# GPU profile (`--profile gpu`):
#   * llama-server   — llama.cpp OpenAI-compatible server (text, vision, embed, rerank)
#   * whisper-server — whisper.cpp OpenAI-compatible transcription server
#
# Run with `podman compose up` — this project targets Podman exclusively (no Docker).
# No `version:` key, only widely-supported compose-spec features, and every value has an
# inline default via `${VAR:-default}` so it works with no `.env` at all. Copy
# `.env.example` → `.env` to override (ports, image tags, credentials).
#
#   podman compose up                    # app + postgres + tika (no inference)
#   podman compose --profile gpu up      # adds llama-server + whisper-server with GPU
#   podman compose -f compose.yaml \
#     -f compose.cpu.yaml \
#     --profile cpu up                   # adds CPU-only inference (compose.cpu.yaml)
#
# GPU inference uses CDI device mounts (`nvidia.com/gpu=all`); for CPU-only inference,
# use the compose.cpu.yaml override file.

name: local-kb

services:
  # ── App (kb binary, P7-T1 Containerfile) ─────────────────────────────────────
  #
  # The app does NOT publish a host port — the Caddy reverse proxy is the single
  # entry point (plan §22, P8-T8). This lets `podman compose up --scale app=3`
  # start multiple replicas without port conflicts; Caddy health-checks and
  # load-balances across them. For direct access during development, connect
  # through Caddy on http://localhost:${CADDY_HTTP_PORT:-9999}, or override
  # the port mapping via a compose.override.yaml.
  app:
    image: ${APP_IMAGE:-kb:latest}
    # NOTE: no `ports:` — Caddy publishes the external port (default 9999) and
    # reverse-proxies to app:9999 on the internal network. Adding ports here
    # would prevent scaling with --scale.
    environment:
      # Storage — the compose-internal hostname `postgres` resolves to the
      # postgres service. These override the compose/config.toml values when set.
      POSTGRES_URL: ${POSTGRES_URL:-postgres://kb:kb@postgres:5432/kb}
      APP_POSTGRES_URL: ${APP_POSTGRES_URL:-postgres://kb_app:kb_app@postgres:5432/kb}
      # Port the HTTP API listens on (overrides config.toml `api.port`).
      PORT: "9999"
      # Sidecar URLs (Tika + Whisper — wired by the app at startup).
      TIKA_URL: ${TIKA_URL:-http://tika:9998}
      WHISPER_URL: ${WHISPER_URL:-http://whisper-server:8080}
      # Auth — MUST be overridden in production (≥32 bytes, random).
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-value}
      # Per-IP login attempt cap per 60s (brute-force guard). Default 5; raise in
      # trusted environments where many logins share one source IP (CI/e2e behind
      # a proxy, office NAT). Read per request — see login_rate_max_attempts.
      KB_LOGIN_RATE_MAX_ATTEMPTS: ${KB_LOGIN_RATE_MAX_ATTEMPTS:-5}
      # Bootstrap — creates the initial tenant + admin on first run.
      # Omit to skip auto-seeding (create the first tenant manually).
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@local.kb}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin}
      # Config file path (used by both `serve` and CLI subcommands).
      KB_CONFIG: /etc/kb/config.toml
      # Logging (plan §18).
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_DIR: ${LOG_DIR:-/data/logs}
    volumes:
      # Persistent data (blobs, logs).
      - kb-data:/data
      # Deployment config mounted read-only.
      - ${CONFIG_FILE:-./compose/config.toml}:/etc/kb/config.toml:ro,Z
    # ── Security: extractor sandbox (plan §17, §31.5) ──────────────────────
    # The app container runs extractor subprocesses (ffmpeg, file) over
    # untrusted user bytes. Defence-in-depth:
    #   - Container runs as non-root (Containerfile USER kb, uid 1000).
    #   - Drop ALL Linux capabilities; add back only what is strictly needed.
    #   - Prevent privilege escalation via setuid binaries or seccomp bypass.
    #   - Memory limit defends against runaway subprocesses (archive bombs, etc.).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # Memory: 4 GiB hard limit; 2 GiB soft (reservation). Covers ffmpeg
    # transcoding + Tika JSON responses + normal request serving.
    mem_limit: "4g"
    mem_reservation: "2g"
    command:
      - "serve"
      - "--config"
      - "/etc/kb/config.toml"
    depends_on:
      postgres:
        condition: service_healthy
      tika:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9999/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ── Dedicated ingest workers (P15-T12, plan §16) ───────────────────────────────
  # OPTIONAL: `kb serve` already embeds a worker pool ([worker].enabled), so the
  # default `up` runs fine without this service. Activate extra drain capacity:
  #
  #   podman compose --profile worker up -d --scale worker=2
  #
  # Set [worker].enabled = false in the app's config to make these the ONLY
  # processors. Heterogeneous fleets: this service covers same-box scaling; a
  # worker on ANOTHER machine runs the same image with THAT machine's own
  # config.toml ([[backend]] slots + [worker] concurrency for ITS models)
  # against the shared Postgres — and REQUIRES [blob] backend = "s3" (P15-T11)
  # so it can fetch the bytes the API node staged.
  #
  # Connection math: each kb process holds two sqlx pools (privileged + kb_app,
  # default ≤ 10 connections each ⇒ ≤ 20/process). Postgres' default
  # max_connections=100 fits the API node + ~3 workers with headroom. Beyond
  # that, raise max_connections or front Postgres with PgBouncer — but note:
  #   - PgBouncer must run in SESSION pooling mode for the app's pools:
  #     LISTEN/NOTIFY (the DB-routing reload notifier) and advisory locks
  #     (ingest dedup) are connection-scoped and break under transaction
  #     pooling. SKIP LOCKED claims are plain row locks and pool fine.
  #   - Workers default to use_db_routing=false (no LISTEN/NOTIFY), so a
  #     transaction-pooled PgBouncer in FRONT OF WORKERS ONLY is workable if
  #     connections get tight; keep the API node on a direct connection.
  #
  # pgbouncer:                                  # optional connection pooler
  #   image: docker.io/edoburu/pgbouncer:latest
  #   environment:
  #     DB_HOST: postgres
  #     DB_USER: kb
  #     DB_PASSWORD: ${POSTGRES_PASSWORD:-kb}
  #     POOL_MODE: session            # REQUIRED for LISTEN/NOTIFY + advisory locks
  #     MAX_CLIENT_CONN: "200"
  #     DEFAULT_POOL_SIZE: "40"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  worker:
    image: ${APP_IMAGE:-kb:latest}
    profiles: ["worker"]
    # No ports: workers only talk outward (Postgres, blobs, model servers,
    # Tika/whisper) — and no ports also keeps --scale worker=N conflict-free.
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-postgres://kb:kb@postgres:5432/kb}
      APP_POSTGRES_URL: ${APP_POSTGRES_URL:-postgres://kb_app:kb_app@postgres:5432/kb}
      # Workers run extraction too — they need reachable sidecars (per-machine
      # reachability note in .env.example).
      TIKA_URL: ${TIKA_URL:-http://tika:9998}
      WHISPER_URL: ${WHISPER_URL:-http://whisper-server:8080}
      KB_CONFIG: /etc/kb/config.toml
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_DIR: ${LOG_DIR:-/data/logs}
      # Shared blob credentials when [blob].backend = "s3" (P15-T11).
      BLOB_S3_ACCESS_KEY: ${BLOB_S3_ACCESS_KEY:-}
      BLOB_S3_SECRET_KEY: ${BLOB_S3_SECRET_KEY:-}
    volumes:
      - kb-data:/data
      - ${CONFIG_FILE:-./compose/config.toml}:/etc/kb/config.toml:ro,Z
    # Same extractor-sandbox hardening as the app (workers process the same
    # untrusted bytes through the same extractors).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: "4g"
    mem_reservation: "2g"
    command:
      - "worker"
      - "--config"
      - "/etc/kb/config.toml"
    # Graceful drain: SIGTERM → stop claiming, finish the in-flight job (long
    # media extractions get a generous window; anything beyond it is requeued
    # by the lease reaper). 90 s > the 60 s in-process drain timeout.
    stop_grace_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      tika:
        condition: service_healthy
    restart: unless-stopped

  # ── Postgres + pgvector — metadata, tags, vectors, keyword index (plan §5) ──────
  postgres:
    # Two-role RLS model (P6-T14, §13): POSTGRES_USER is the PRIVILEGED owner/superuser the app's
    # admin pool uses (POSTGRES_URL in .env) for migrations + the cross-tenant job queue. Migration
    # 0006 auto-creates the non-privileged `kb_app` role (NOSUPERUSER NOBYPASSRLS) that the app's
    # tenant-data pool connects as (APP_POSTGRES_URL in .env) so RLS is actually enforced. Rotate
    # kb_app's default password (ALTER ROLE kb_app PASSWORD '…') for real deployments.
    #
    # Image is fully qualified (docker.io/… = the Docker Hub registry) to satisfy Podman's
    # strict short-name policy with no interactive registry prompt.
    image: ${POSTGRES_IMAGE:-docker.io/pgvector/pgvector:pg17}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kb}
      POSTGRES_DB: ${POSTGRES_DB:-kb}
      # data-checksums detect on-disk page corruption (plan §23). They can ONLY be
      # turned on at cluster init, so they are baked into the very first `initdb`;
      # they apply to a *fresh* data volume (delete the volume to re-init).
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # Published on loopback only by default — dev tooling and the host-run app reach
    # it at localhost:5432; in-compose services would use the `postgres` hostname.
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Headroom for parallel pgvector HNSW index builds (plan §5); default /dev/shm
    # in a container is a cramped 64 MB.
    shm_size: "256mb"
    healthcheck:
      # The init phase runs a temporary socket-only server, so checking over TCP
      # (-h 127.0.0.1) reports healthy only once the *real* server is accepting
      # connections. pg_isready needs no credentials.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ── Apache Tika — extracts text + metadata from arbitrary documents (plan §2) ───
  tika:
    # Default is the minimal server image; override with the `-full` variant (adds
    # Tesseract OCR + more format support) via TIKA_IMAGE in .env when you need it.
    image: ${TIKA_IMAGE:-docker.io/apache/tika:3.3.0.0}
    ports:
      - "${TIKA_BIND:-127.0.0.1}:${TIKA_PORT:-9998}:9998"
    # ── Security: Tika parses untrusted documents (plan §17, §31.5) ────────
    # Tika is a Java process that handles attacker-controlled bytes (PDFs with
    # embedded JS, crafted OOXML, etc.). Sandbox it tightly:
    #   - Drop ALL capabilities, no new privileges.
    #   - No network access beyond the compose-internal network (the app
    #     connects inbound; Tika needs no outbound access).
    #   - Memory limit prevents a single malicious document from OOMing the host.
    #   - The `-full` image (with Tesseract OCR) is notably larger — increase
    #     mem_limit if you enable that variant.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: "2g"
    healthcheck:
      # The minimal Tika image ships no curl/wget, but is Ubuntu-based, so bash's
      # /dev/tcp probes the port directly. Tika binds 9998 only once it is ready,
      # so a successful connect is a sound readiness signal. `timeout` guards hangs.
      test: ["CMD", "timeout", "5", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9998"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ── Caddy reverse proxy — TLS, security headers, request logging (plan §22, P8-T8) ─
  #
  # Caddy is the single entry point for HTTP traffic. It terminates TLS (if a domain
  # is configured via CADDY_DOMAIN), adds security headers, logs requests in JSON, and
  # reverse-proxies to `app:9999`. When `--scale app=N` is used, Caddy health-checks
  # each upstream and load-balances across healthy instances.
  caddy:
    image: ${CADDY_IMAGE:-docker.io/caddy:2-alpine}
    ports:
      - "${CADDY_HTTP_BIND:-127.0.0.1}:${CADDY_HTTP_PORT:-9999}:80"
      - "${CADDY_HTTPS_BIND:-127.0.0.1}:${CADDY_HTTPS_PORT:-9443}:443"
    volumes:
      - ${CADDYFILE:-./compose/Caddyfile}:/etc/caddy/Caddyfile:ro,Z
      - caddy-data:/data
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
    depends_on:
      - app
    restart: unless-stopped

  # ── PgBouncer connection pooler (plan §22, P8-T8) ──────────────────────────
  #
  # Sits between the app and Postgres, pooling connections in transaction mode.
  # Essential when scaling app replicas: each replica opens its own pool to Postgres,
  # and PgBouncer multiplexes them so Postgres isn't overwhelmed. Enabled via the
  # `pooling` profile — without it the app connects directly to Postgres.
  pgbouncer:
    profiles: ["pooling"]
    image: ${PGBOUNCER_IMAGE:-docker.io/bitnami/pgbouncer:1.25}
    ports:
      - "${PGBOUNCER_BIND:-127.0.0.1}:${PGBOUNCER_PORT:-6432}:6432"
    volumes:
      - ${PGBOUNCER_INI:-./compose/pgbouncer.ini}:/etc/pgbouncer/pgbouncer.ini:ro,Z
      - ${PGBOUNCER_USERLIST:-./compose/userlist.txt}:/etc/pgbouncer/userlist.txt:ro,Z
    environment:
      PGBOUNCER_DATABASE: ${POSTGRES_DB:-kb}
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-kb}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-kb}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── llama.cpp server (GPU profile) — OpenAI-compatible chat + embed + rerank ──
  # Runs an LLM locally with GPU acceleration. Uses the CDI device interface for
  # Podman GPU passthrough. The same server process handles chat, vision (with a
  # multimodal model), embeddings (with --embedding), and reranking (model-dependent).
  llama-server:
    profiles: ["gpu"]
    image: ${LLAMA_SERVER_IMAGE:-docker.io/ghcr.io/ggerganov/llama.cpp:server}
    ports:
      - "${LLAMA_BIND:-127.0.0.1}:${LLAMA_PORT:-8080}:8080"
    volumes:
      - ${LLAMA_MODEL_PATH:-./models}:/models:ro
    environment:
      LLAMA_ARG_MODEL: /models/${LLAMA_MODEL_FILE:-model.gguf}
      LLAMA_ARG_HOST: "0.0.0.0"
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_N_GPU_LAYERS: ${LLAMA_N_GPU_LAYERS:-99}
      LLAMA_ARG_CTX_SIZE: ${LLAMA_CTX_SIZE:-8192}
    # CDI device mount for Podman GPU access (nvidia.com/gpu=all).
    # To use a specific GPU index: `nvidia.com/gpu=0` or `nvidia.com/gpu=0,1`.
    devices:
      - ${GPU_DEVICE:-nvidia.com/gpu=all}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # ── whisper.cpp server (GPU profile) — OpenAI-compatible audio transcription ──
  whisper-server:
    profiles: ["gpu"]
    image: ${WHISPER_SERVER_IMAGE:-docker.io/ghcr.io/ggerganov/whisper.cpp:server}
    ports:
      - "${WHISPER_BIND:-127.0.0.1}:${WHISPER_PORT:-8081}:8080"
    volumes:
      - ${WHISPER_MODEL_PATH:-./models}:/models:ro
    environment:
      WHISPER_MODEL: /models/${WHISPER_MODEL_FILE:-whisper-model.gguf}
    devices:
      - ${GPU_DEVICE:-nvidia.com/gpu=all}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  kb-data:
  caddy-data:

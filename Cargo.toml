[workspace]
resolver = "3"
members = ["crates/*"]

# Shared package metadata. Each crate inherits these with `field.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"

# Single source of truth for dependency versions. Crates opt in with
# `dep = { workspace = true }`. Versions verified against crates.io on 2026-05-29
# (see BUILD_LEDGER.toml note: the plan's crate names had drifted).
[workspace.dependencies]
# Internal crates
kb-core = { path = "crates/core", version = "0.1.0" }
kb-config = { path = "crates/config", version = "0.1.0" }
kb-mock-backend = { path = "crates/mock-backend", version = "0.1.0" }
kb-scheduler = { path = "crates/scheduler", version = "0.1.0" }
kb-store = { path = "crates/store", version = "0.1.0" }
kb-llm = { path = "crates/llm", version = "0.1.0" }
kb-pipeline = { path = "crates/pipeline", version = "0.1.0" }
kb-extract = { path = "crates/extract", version = "0.1.0" }
kb-testsupport = { path = "crates/testsupport", version = "0.1.0" }
# External
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
async-trait = "0.1.89"
anyhow = "1.0.102"
thiserror = "2.0.18"
chrono = { version = "0.4.44", features = ["serde"] }
hex = "0.4.3"
bytes = "1.11.1"
arc-swap = "1.9.1"
notify = "8"
toml = "0.9"
tracing = "0.1.44"
tempfile = "3"
# Async runtime + Postgres/pgvector store. sqlx pulls its own tokio (runtime-tokio); the
# extra tokio entry here is for tests that need `#[tokio::test]`. No TLS feature: local
# connections are plaintext for now (rustls is added with the networked store impl, §14/§20).
tokio = { version = "1.52.3", default-features = false }
# Lock-free concurrent map for the scheduler's role → backends registry (plan §6.2).
dashmap = "6.1.0"
reqwest = { version = "0.13.4", default-features = false }
# Pinned to 0.8.x: sqlx 0.9 raised its MSRV to rustc 1.94, but the toolchain is pinned to
# 1.92.0 (rust-toolchain.toml). The Migrator / migrate! / Migration API used here is stable
# across 0.7–0.9, so this is purely an MSRV-compat pin (§31.6: verify versions before use).
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tree_magic_mini = "3.2.2"
zip = "2"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.10"
clap = { version = "4.6.1", features = ["derive"] }
testcontainers = "0.27.3"

# Workspace-wide lints, inherited by every crate via `[lints] workspace = true`.
# These enforce the §31 quality bar mechanically (docs, no-stubs, no-unwrap).
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"

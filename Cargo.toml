[workspace]
resolver = "3"
members = ["crates/*"]

# Shared package metadata. Each crate inherits these with `field.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"

# Single source of truth for dependency versions. Crates opt in with
# `dep = { workspace = true }`. Versions verified against crates.io on 2026-05-29
# (see BUILD_LEDGER.toml note: the plan's crate names had drifted).
[workspace.dependencies]
# Internal crates
kb-core = { path = "crates/core" }
# External
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
async-trait = "0.1.89"
anyhow = "1.0.102"
thiserror = "2.0.18"
chrono = { version = "0.4.44", features = ["serde"] }
hex = "0.4.3"
bytes = "1.11.1"

# Workspace-wide lints, inherited by every crate via `[lints] workspace = true`.
# These enforce the §31 quality bar mechanically (docs, no-stubs, no-unwrap).
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
